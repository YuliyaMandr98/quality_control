[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-bugs-tool-claude"
version = "0.1.0"
description = "Standalone Jira bug triage workflow (Confluence spec lookup + Claude classification), extracted from Trace2Quality - Claude edition"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.26,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "cryptography>=42.0",
    "anthropic>=1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
